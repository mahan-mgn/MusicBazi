name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first — especially the
        streaming and YouTube sections, where many reports have the same root cause.

        **Do not paste `.env` contents, cookies, tokens, or signed stream URLs.**
        Redact anything that looks like a credential.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Opened an album from the artist page
        2. Pressed Play on track 3
        3. Expected playback; got a spinner that never resolved
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it
      options:
        - Docker Compose
        - Local development (npm run dev + uvicorn)
        - Android APK against a server
        - Termux (server on the phone itself)
        - Railway / other cloud host
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA.
      placeholder: v1.3.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Server output (`docker compose logs server`) or browser console.
        Remove URLs, tokens, and file paths that identify you.
      render: shell

  - type: checkboxes
    id: connectivity
    attributes:
      label: Network situation
      options:
        - label: International connectivity is unavailable right now (intranet mode)
        - label: This happens only over a proxy
        - label: `ffmpeg` is installed and on PATH

  - type: textarea
    id: health
    attributes:
      label: `/api/health` output
      description: |
        Paste the response from `curl http://localhost:8080/api/health` (redact hosts).
      render: json
