# گیت‌های کیفیت — همان دروازه‌هایی که محلی هم اجرا می‌شوند:
# tsc، vitest، بیلد پروداکشن، و pytest بک‌اند. بدون شبکه‌ی بیرونی و بدون کلید.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsc -b هم داخل build هست، ولی جدا اجرا می‌شود تا خطای تایپ از خطای
      # باندل تفکیک شود
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      # تست‌های artblur/artborder/mood/loudness مستقیم ffmpeg صدا می‌زنند؛
      # runner اوبونتو از قبل ندارد.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements-dev.txt
      # conftest خودش MUSICBAZI_ENV_NO_FILES=1 می‌گذارد — هیچ .env توسعه‌دهنده
      # یا کلید واقعی در CI خوانده نمی‌شود.
      - run: python -m pytest -p no:warnings
