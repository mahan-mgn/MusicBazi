<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover لازمه‌ی env(safe-area-inset-*) است — بدونش روی آیفون
      حاشیه‌های امن همیشه صفر برمی‌گردند و نوار پخش زیر خطِ خانه می‌رود.
      interactive-widget=resizes-content: با باز شدن کیبورد، محتوا کوچک می‌شود
      به‌جای اینکه نوارهای ثابتِ پایین بپرند وسط صفحه.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- رنگ نوار مرورگر با تم صفحه هماهنگ می‌شود، نه همیشه تیره -->
    <meta name="theme-color" content="#070707" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <!-- iOS «افزودن به صفحه‌ی اصلی» را تمام‌صفحه (بدون نوار مرورگر) می‌کند -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="موزیک بازی" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- سافاری وگرنه شماره‌ی تلفن و تاریخ را داخل عنوان آهنگ‌ها لینک می‌کند -->
    <meta name="format-detection" content="telephone=no" />
    <title>موزیک بازی — دانلود موزیک، آلبوم و پلی‌لیست</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- اسکریپت مینی‌اپ تلگرام برای همگام‌سازی ابعاد و تم هنگام باز شدن در تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
